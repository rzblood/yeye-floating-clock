<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>椰椰桌面时钟</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage" data-weather="clear" aria-label="椰椰桌面宠物">
    <div class="edge-glow"></div>
    <header class="hud">
      <button id="clock-card" class="glass clock-card" title="打开设置">
        <span id="time">00:00:00</span><span id="date">正在唤醒椰椰…</span>
      </button>
      <button id="weather-chip" class="glass weather-chip" title="刷新天气">
        <span id="weather-icon">◌</span><span id="weather-temp">--°</span>
      </button>
    </header>

    <section id="pet" class="pet" aria-label="紫色番薯桌面宠物">
      <img class="pet-body" src="assets/pet-puppet-body.png" alt="">
      <img class="pet-arm pet-arm-left" src="assets/pet-cute-left-arm.png" alt="">
      <img class="pet-arm pet-arm-right" src="assets/pet-cute-right-arm.png" alt="">
    </section>

    <div id="speech" class="speech hidden"></div>
    <div id="snap-toast" class="snap-toast hidden">已稳稳站好</div>

    <section id="settings" class="panel hidden" aria-label="设置">
      <header class="panel-header">
        <div><span class="eyebrow">YEYE COMPANION</span><strong>椰椰控制台</strong></div>
        <button id="close-settings" class="icon-button" aria-label="关闭">×</button>
      </header>
      <div class="panel-scroll">
        <section class="setting-section">
          <h2>闹钟</h2>
          <form id="alarm-form">
            <input id="alarm-time" type="time" required>
            <input id="alarm-label" maxlength="18" placeholder="提醒内容">
            <button type="submit" class="primary">添加</button>
          </form>
          <div id="alarm-list"></div>
        </section>
        <section class="setting-section">
          <h2>外观与行为</h2>
          <label class="range-row"><span>桌宠大小 <b id="scale-value">82%</b></span><input id="pet-scale" type="range" min="50" max="125" value="82"></label>
          <label class="range-row"><span>面板透明度 <b id="panel-opacity-value">94%</b></span><input id="panel-opacity" type="range" min="10" max="100" value="94"></label>
          <label class="select-row"><span>窗口层级</span><select id="window-level"><option value="top">始终置顶</option><option value="desktop">桌面层级</option></select></label>
          <label class="switch-row"><span>窗口吸附</span><input id="snap-enabled" type="checkbox" checked></label>
          <label class="switch-row"><span>边缘躲藏（只露手）</span><input id="edge-hide-enabled" type="checkbox"></label>
          <label class="switch-row"><span>安静休息</span><input id="pause-motion" type="checkbox"></label>
          <label class="switch-row"><span>镜像显示</span><input id="mirror-pet" type="checkbox"></label>
          <label class="switch-row"><span>开机启动</span><input id="autostart" type="checkbox"></label>
        </section>
        <section class="setting-section">
          <h2>天气与时间</h2>
          <div class="weather-form"><input id="weather-city" maxlength="40" placeholder="城市，例如：上海"><button id="refresh-weather" type="button" class="secondary">更新</button></div>
          <label class="switch-row"><span>显示天气</span><input id="weather-enabled" type="checkbox" checked></label>
          <div id="weather-detail" class="weather-detail">尚未获取天气</div>
          <div class="sync-row"><span id="sync-status">使用系统时间</span><button id="sync-now" type="button" class="text-button">立即对时</button></div>
          <small class="attribution">天气数据：Open‑Meteo · 每 30 分钟更新</small>
        </section>
      </div>
      <footer class="panel-footer"><span id="app-status">预览版 0.0.2 · Tauri 2</span><button id="quit" class="danger-button">退出椰椰</button></footer>
    </section>

    <section id="alarm-overlay" class="panel alarm hidden" role="alert">
      <span class="alarm-bell">♪</span><strong id="alarm-title">闹钟时间到</strong><p>椰椰来叫你啦</p>
      <div class="alarm-actions"><button id="snooze" class="secondary">5 分钟后</button><button id="stop-alarm" class="primary">知道了</button></div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
