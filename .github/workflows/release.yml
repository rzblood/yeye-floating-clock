name: Build portable releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run frontend:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --no-bundle
      - name: Prepare portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "src-tauri/target/release/yeye-floating-clock.exe" "artifacts/Yeye-Floating-Clock-${{ env.RELEASE_VERSION }}-Windows-x64-Portable.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-portable
          path: artifacts/*

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run frontend:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build ad-hoc signed app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles app
      - name: Prepare portable app archive
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/椰椰悬浮时钟.app" \
            "artifacts/Yeye-Floating-Clock-${{ env.RELEASE_VERSION }}-macOS-Apple-Silicon.app.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-Apple-Silicon
          path: artifacts/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --title "Yeye Floating Clock ${{ github.ref_name }}"
